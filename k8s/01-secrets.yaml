apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: saga
type: Opaque
stringData:
  order-username: order_user
  order-password: order_pass
  payment-username: payment_user
  payment-password: payment_pass
  inventory-username: inventory_user
  inventory-password: inventory_pass
  user-username: user_user
  user-password: user_pass
  product-username: product_user
  product-password: product_pass
  # Replace before applying. Do not commit real secrets to this file.
  jwt-secret: CHANGE_ME_JWT_SECRET
  user-admin-username: admin
  user-admin-password: CHANGE_ME_ADMIN_PASSWORD
