apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: saga
spec:
  type: LoadBalancer
  selector: {app: api-gateway}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: saga
spec:
  replicas: 1
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      containers:
        - name: api-gateway
          image: "jeevan7979/saga-chorography-api-gateway:latest"
          ports: [{containerPort: 8080}]
          env:
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: database-credentials, key: jwt-secret}}
            - {name: USER_SERVICE_URL, value: "http://user-service:8084"}
            - {name: PRODUCT_SERVICE_URL, value: "http://product-service:8085"}
            - {name: ORDER_SERVICE_URL, value: "http://order-service:8081"}
