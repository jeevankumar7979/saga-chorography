apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: saga
spec:
  type: ClusterIP
  selector: {app: order-service}
  ports: [{port: 8081, targetPort: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: saga
spec:
  replicas: 1
  selector: {matchLabels: {app: order-service}}
  template:
    metadata: {labels: {app: order-service}}
    spec:
      containers:
        - name: order-service
          image: "jeevan7979/saga-chorography-order-service:latest"
          imagePullPolicy: Always
          ports: [{containerPort: 8081}]
          env:
            - {name: SPRING_KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092"}
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://order-db:5432/orderdb"}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: database-credentials, key: order-username}}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: database-credentials, key: order-password}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: database-credentials, key: jwt-secret}}
            - {name: OTEL_SERVICE_NAME, value: order-service}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-lgtm:4318"}
---
