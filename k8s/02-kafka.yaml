apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: saga
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: saga
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.7.0
          ports:
            - name: broker
              containerPort: 9092
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: broker,controller}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
          volumeMounts:
            - {name: kafka-data, mountPath: /var/lib/kafka/data}
          readinessProbe:
            exec:
              command: ["bash", "-ec", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
  namespace: saga
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init-topics
          image: confluentinc/cp-kafka:7.7.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until kafka-broker-api-versions --bootstrap-server kafka:9092; do sleep 5; done
              kafka-topics --create --if-not-exists --topic order-event --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
              kafka-topics --create --if-not-exists --topic payment-event --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
              kafka-topics --create --if-not-exists --topic inventory-event --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
